<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Sowmiya Rajendran through the accessible portfolio contact form.">

    <meta name="author"
          content="Sowmiya Rajendran">

    <meta name="robots"
          content="index, follow">

    <title>Contact | Sowmiya Rajendran</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <nav aria-label="Main navigation">

        <a href="index.html" class="logo">
            Sowmiya
        </a>

        <ul>

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="about.html">About</a>
            </li>

            <li>
                <a href="projects.html">Projects</a>
            </li>

            <li>
                <a href="contact.html" aria-current="page">
                    Contact
                </a>
            </li>

        </ul>
        <button
    type="button"
    id="theme-toggle"
    aria-label="Switch to dark mode">
    🌙
</button>

    </nav>
    

</header>


<main>

    <section aria-labelledby="contact-title">

        <h1 id="contact-title">
            Contact Me
        </h1>

        <p>
            Have a question or want to work together?
            Send me a message.
        </p>


        <form action="#" method="post">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required
                    aria-required="true"
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                    aria-required="true"
                >

            </div>


            <div class="form-group">

                <label for="subject">
                    Subject
                </label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    required
                    aria-required="true"
                >

            </div>


            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    required
                    aria-required="true"
                ></textarea>

            </div>


            <button type="submit">
                Send Message
            </button>

        </form>

    </section>

</main>


<footer>

    <p>
        &copy; 2026 Sowmiya Rajendran.
    </p>

</footer>
<script src="script.js"></script>
</body>
</html>
